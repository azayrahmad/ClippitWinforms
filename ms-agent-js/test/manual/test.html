<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Agent JS - Clean Integration Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #008080;
            color: white;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .window {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 2px;
            width: 300px;
            position: absolute;
            top: 50px;
            left: 50px;
            color: black;
        }
        .title-bar {
            background: #000080;
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .window-body {
            padding: 10px;
        }
        button {
            margin: 5px;
            padding: 2px 10px;
        }
        #log {
            background: white;
            border: 1px inset;
            height: 100px;
            overflow-y: scroll;
            font-size: 12px;
            padding: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>Agent Controller</span>
    </div>
    <div class="window-body">
        <button id="show-btn">Show</button>
        <button id="hide-btn">Hide</button>
        <br>
        <button id="greet-btn">Greet</button>
        <button id="move-btn">Move to Random</button>

        <div id="log"></div>
    </div>
</div>

<!-- Load UMD Bundle -->
<script src="./ms-agent-js.umd.js"></script>
<script>
    const { Agent } = MSAgentJS;
    const logEl = document.getElementById('log');

    function log(msg) {
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    async function init() {
        const agent = new Agent({ scale: 2 });

        agent.addEventListener('show', () => log('Agent shown'));
        agent.addEventListener('hide', () => log('Agent hidden'));
        agent.addEventListener('animationStart', (e) => log(`Anim start: ${e.detail.name}`));
        agent.addEventListener('animationEnd', (e) => log(`Anim end: ${e.detail.name}`));
        agent.addEventListener('moveStart', (e) => log(`Move start to ${e.detail.x}, ${e.detail.y}`));
        agent.addEventListener('moveEnd', () => log('Move end'));

        log('Loading agent...');
        try {
            await agent.load('./agents/Clippit/CLIPPIT.acd');
            log('Agent loaded!');

            document.getElementById('show-btn').onclick = () => agent.show();
            document.getElementById('hide-btn').onclick = () => agent.hide();
            document.getElementById('greet-btn').onclick = () => agent.play('Greeting');
            document.getElementById('move-btn').onclick = () => {
                const x = Math.random() * (window.innerWidth - 100);
                const y = Math.random() * (window.innerHeight - 100);
                agent.moveTo(x, y);
            };

            await agent.show();
            agent.moveTo(window.innerWidth - 200, window.innerHeight - 200);

        } catch (err) {
            log(`Error: ${err.message}`);
        }
    }

    init();
</script>
</body>
</html>
